[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shoutabout"
version = "1.0.5"
description = "iPhone -> PC voice dictation hub: local GPU transcription with custom vocabulary"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ShoutAbout contributors" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.6",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
    "faster-whisper>=1.2.1,<1.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "segno>=1.6",
    "psutil>=6.0",
    "sounddevice>=0.5",
    "tomlkit>=0.13",
    # macOS only (v2-macos): the menu bar app, the mouth overlay, the hotkey (CGEventTap),
    # pasting (NSPasteboard + CGEventPost) and the permission checks. PyObjC is MIT.
    "pyobjc-core>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# NVIDIA CUDA 12 cuBLAS as a pip wheel, so no system CUDA toolkit install is needed.
# CTranslate2 >= 4.6.3 Windows wheels are built without cuDNN, so cuDNN isn't required.
# Installed by scripts/setup.ps1 (`uv sync --extra cuda`).
cuda = [
    "nvidia-cublas-cu12>=12.4,<13",
]
# PyAV (FFmpeg) is NOT a runtime dependency of the app: audio is decoded by numpy (WAV) and
# Windows Media Foundation, and the Windows installer must not ship FFmpeg (PyAV's wheels
# bundle GPL codecs; docs/licenses.md). It is still installed in every source checkout,
# because faster-whisper depends on it, and src/shoutabout/pyavdecode.py uses it as the
# decoder off Windows (Linux CI) and as a fallback. This extra only pins a known-good range.
pyav = [
    "av>=13,<19",
]

[project.scripts]
shoutabout = "shoutabout.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Build tools for the Windows installer (packaging/, docs/installer.md). Not installed by a
# plain `uv sync`: use `uv sync --locked --extra cuda --group packaging`. PyInstaller is
# GPL-2.0 with a bootloader exception, so the frozen app it produces isn't GPL; it is only
# used at build time and never shipped as a library.
packaging = [
    "pyinstaller>=6.11",
]

[tool.uv]
# Resolve only releases at least ~2 weeks old as of the v1 build, for stability.
# Bump this date (or remove it) and run `uv lock --upgrade` to take newer releases.
exclude-newer = "2026-09-25T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/shoutabout"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "windows: needs real Windows desktop APIs (run with --run-windows)",
    "gpu: needs CUDA GPU + downloaded Whisper model (run with --run-gpu)",
    "ollama: needs a running Ollama with the cleanup model pulled (run with --run-ollama)",
]
